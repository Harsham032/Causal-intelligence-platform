[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cip"
version = "0.1.0"
description = "Experimentation and causal inference platform for treatment-effect estimation, uplift modelling and evidence-based decisions."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "harsham032" }]
keywords = ["causal-inference", "experimentation", "uplift-modelling", "ab-testing", "treatment-effects"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "econml>=0.15",
    "pymc>=5.10",
    "arviz>=0.17",
    "causaldata>=0.1.4",
    "duckdb>=0.10",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32", "altair>=5.2"]
postgres = ["psycopg[binary]>=3.1", "SQLAlchemy>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/Harsham032/causal-intelligence-platform"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cip = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
# E501: line length is black's job.
# B008: call expressions in defaults are idiomatic for the frameworks used here.
# N803/N806: `X`, `Y`, `T`, `W` for design matrices and treatment vectors are the
# conventions of the causal inference literature and of econml's own API;
# renaming them to satisfy PEP 8 would make the code harder to check against
# the estimators it implements.
ignore = ["E501", "B008", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"scripts/*" = ["T201"]
"app/*" = ["T201"]

[tool.mypy]
python_version = "3.11"
packages = ["cip"]
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests taking more than a few seconds",
    "mcmc: tests that run MCMC sampling (deselected by default in CI's fast lane)",
]

[tool.coverage.run]
source = ["src/cip"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
