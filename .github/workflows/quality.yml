name: quality

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Check formatting
        run: black --check src tests scripts app

      - name: Lint
        run: ruff check src tests scripts app

      - name: Type check
        run: mypy

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan tracked files for credentials
        run: python scripts/secrets_scan.py

      - name: Confirm no environment file is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git"
            exit 1
          fi

      - name: Confirm no dataset or model artifact is tracked
        run: |
          oversized=$(git ls-files -z \
            | xargs -0 -I{} sh -c 'test -f "{}" && [ "$(wc -c < "{}")" -gt 2097152 ] && echo "{}"' \
            || true)
          if [ -n "${oversized}" ]; then
            echo "::error::files larger than 2MB are tracked:"
            echo "${oversized}"
            exit 1
          fi
          for pattern in '*.parquet' '*.duckdb' '*.csv.gz' '*.joblib'; do
            found=$(git ls-files "${pattern}")
            if [ -n "${found}" ]; then
              echo "::error::generated artifacts are tracked: ${found}"
              exit 1
            fi
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
